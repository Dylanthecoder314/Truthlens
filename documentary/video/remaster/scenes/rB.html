<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rB · The questions</title>
<link rel="stylesheet" href="../../scenes/style.css">
<style>
  :root { --route: #ff3b3b; --led: #ffab1f; }
  .kick { left: 120px; top: 84px; }
  .shade { inset: 0; background: linear-gradient(90deg, rgba(6, 14, 19, .92) 0%, rgba(6, 14, 19, .78) 48%, rgba(6, 14, 19, .25) 100%); }
  .block { left: 120px; top: 250px; max-width: 1240px; }
  .q { font-family: var(--display); font-weight: 700; font-size: 104px; line-height: .98; text-wrap: balance; }
  .qs { font-family: var(--data); font-size: 28px; letter-spacing: .06em; color: var(--ink-2); margin-top: 34px; line-height: 1.5; }
  .bar { position: relative; margin-top: 56px; width: 980px; height: 90px; }
  .bar .line { position: absolute; left: 0; top: 18px; height: 6px; background: linear-gradient(90deg, var(--route), var(--led)); transform-origin: left center; }
  .bar .end { position: absolute; top: 8px; width: 26px; height: 26px; border-radius: 50%; border: 4px solid var(--ink); background: var(--bg); }
  .bar .lab { position: absolute; top: 48px; font-family: var(--data); font-size: 24px; letter-spacing: .06em; color: var(--ink-2); white-space: nowrap; }
  .bar .lab b { color: var(--ink); }
  .bar .mid { position: absolute; top: -34px; left: 50%; transform: translateX(-50%); font-family: var(--data); font-size: 24px; letter-spacing: .1em; text-transform: uppercase; color: var(--led); }
  .list .hd { font-family: var(--display); font-weight: 700; font-size: 104px; line-height: 1; margin-bottom: 28px; }
  .list .it { font-family: var(--display); font-weight: 600; font-size: 66px; line-height: 1.12; padding: 8px 0 10px; border-bottom: 1px solid var(--line); display: flex; gap: 28px; align-items: baseline; }
  .list .it span { font-family: var(--data); font-size: 26px; color: var(--ink-3); width: 44px; }
  .list .foot { font-family: var(--data); font-size: 26px; letter-spacing: .04em; color: var(--led); margin-top: 30px; }
  .souls { left: 120px; top: 170px; }
  .souls .how { font-family: var(--display); font-weight: 700; font-size: 88px; line-height: 1; }
  .souls .num { font-family: var(--display); font-weight: 800; font-size: 400px; line-height: .8; letter-spacing: -.01em; margin-top: 30px; }
  .souls .unit { font-family: var(--data); font-size: 32px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); margin-top: 26px; }
  .souls .beacon { font-family: var(--data); font-size: 28px; letter-spacing: .04em; color: var(--led); margin-top: 40px; }
  .pings { left: 120px; top: 330px; text-align: left; font-family: var(--data); font-size: 28px; letter-spacing: .06em; color: var(--ink-2); }
  .pings b { display: block; font-family: var(--display); font-weight: 700; font-size: 64px; letter-spacing: 0; color: var(--ink); margin-bottom: 8px; }
  .endcard { left: 120px; top: 300px; }
  .endcard .big { font-family: var(--display); font-weight: 800; font-size: 300px; line-height: .8; }
  .endcard .lost { font-family: var(--display); font-weight: 500; font-size: 92px; letter-spacing: .32em; text-transform: uppercase; color: var(--route); margin-top: 26px; }
  .endcard .meta { font-family: var(--data); font-size: 30px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-top: 40px; }
  .map .arc.a7 { stroke: var(--route); }
</style>
</head>
<body data-scene="rB">
<div id="stage"></div>
<script src="../../scenes/mapdata.js"></script>
<script src="timing.js"></script>
<script src="../../scenes/lib.js"></script>
<script>
(function () {
  var C = S.cue;
  var m, mapWrap, rings = [], ringLab, shade, kick, intro, q1, q1sub, bar, barLine, q2, q2sub, list, items, listFoot, souls, soulsHow, soulsNum, soulsUnit, soulsBeacon, pings, endcard;

  S.scene({
    fadeIn: 1.0,
    fadeOut: 1.6,
    setup: function () {
      mapWrap = S.div("abs", S.stage); mapWrap.style.inset = "0";
      m = S.map("ocean", mapWrap);
      var g = m.layer();
      g.setAttribute("mask", m.fadeWest(70, 86));
      S.RINGS.forEach(function (r) {
        rings.push(S.el("path", { "class": "arc" + (r.n === 7 ? " a7" : ""), d: S.pathFrom(m.P, S.ringPts(r.d, 0, 172, 1)) }, g));
      });
      ringLab = S.pin(m.layer(), m.P, S.ringPoint(44.2, S.ringThetaAtLat(44.2, -28)), ["7th arc", "08:19 MYT"], { anchor: "start", dx: 24, sub: true });

      shade = S.div("abs shade", S.stage);
      kick = S.div("abs kicker kick", S.stage); kick.textContent = "The questions";

      intro = S.div("abs block", S.stage, '<div class="q">Dozens of conflicting questions</div>');
      q1 = S.div("abs block", S.stage,
        '<div class="q">What happened in the cockpit?</div>' +
        '<div class="bar"><div class="mid">63 minutes</div><div class="line"></div><div class="end e1" style="left:-13px"></div><div class="end e2" style="left:967px"></div>' +
        '<div class="lab" style="left:-13px">Last words <b>01:19:30</b></div><div class="lab" style="right:-13px">Last radar contact <b>02:22:12</b></div></div>');
      bar = q1.querySelector(".bar"); barLine = q1.querySelector(".line");
      q2 = S.div("abs block", S.stage,
        '<div class="q">Who was flying the Boeing 777?</div>' +
        '<div class="qs">The 2018 safety investigation found the turns were most likely flown by hand.</div>');
      q2sub = q2.querySelector(".qs");
      list = S.div("abs block list", S.stage,
        '<div class="hd">Was it…</div>' +
        '<div class="it"><span>01</span>a catastrophic decompression?</div>' +
        '<div class="it"><span>02</span>a lithium-ion battery fire?</div>' +
        '<div class="it"><span>03</span>an unprecedented cyber hijack?</div>' +
        '<div class="it"><span>04</span>a deliberate act from the flight deck?</div>' +
        '<div class="foot">None has been proven. The official investigation could not determine the cause.</div>');
      list.style.top = "190px";
      items = list.querySelectorAll(".it"); listFoot = list.querySelector(".foot");
      souls = S.div("abs souls", S.stage,
        '<div class="how">How could a Boeing 777 vanish?</div><div class="num">239</div><div class="unit">people on board</div>' +
        '<div class="beacon">No distress call. No emergency beacon signal detected.</div>');
      soulsHow = souls.querySelector(".how"); soulsNum = souls.querySelector(".num"); soulsUnit = souls.querySelector(".unit"); soulsBeacon = souls.querySelector(".beacon");
      pings = S.div("abs pings", S.stage, "<b>Seven satellite handshakes</b>All that the aircraft left behind");
      endcard = S.div("abs endcard", S.stage,
        '<div class="big">MH370</div><div class="lost">Lost</div><div class="meta">8 March 2014 · 239 people · never found</div>');
    },
    draw: function (t) {
      // Slow drift over the southern Indian Ocean.
      // Drift, then pull back to frame all seven rings when the pings arrive.
      var d = S.ease(S.prog(t, 0, C("pings") - 1));
      var pull = S.ease(S.prog(t, C("pings") - 1.2, C("pings") + 1.6));
      m.cameraLL(S.lerp(S.lerp(84, 88, d), 80, pull), S.lerp(S.lerp(-8, -13, d), -10, pull), S.lerp(S.lerp(1.45, 1.35, d), 0.92, pull));
      S.show(mapWrap, 0.55 + 0.35 * S.prog(t, C("pings") - 1, C("pings") + 2));
      var shadeO = 1 - 0.35 * S.fadeWin(t, C("pings") - 0.5, C("greatest") - 0.4, 0.8);
      S.show(shade, shadeO);
      S.show(kick, S.fadeWin(t, 0.6, C("greatest") - 0.2, 0.6));

      S.show(intro, S.fadeWin(t, 0.9, C("q1") - 0.1, 0.6));

      var o1 = S.fadeWin(t, C("q1") - 0.2, C("q2") - 0.2, 0.5);
      S.show(q1, o1, "translateY(" + (20 * (1 - S.easeOut(S.prog(t, C("q1") - 0.2, C("q1") + 0.6)))).toFixed(1) + "px)");
      var bp = S.ease(S.prog(t, C("q1b"), C("q1b") + 2.4));
      S.show(bar, S.easeOut(S.prog(t, C("q1b") - 0.4, C("q1b") + 0.2)));
      barLine.style.width = (980 * bp).toFixed(1) + "px";

      S.show(q2, S.fadeWin(t, C("q2") - 0.2, C("decomp") - 0.4, 0.5), "translateY(" + (20 * (1 - S.easeOut(S.prog(t, C("q2") - 0.2, C("q2") + 0.6)))).toFixed(1) + "px)");
      S.show(q2sub, S.easeOut(S.prog(t, C("zigzag") + 0.4, C("zigzag") + 1.0)));

      S.show(list, S.fadeWin(t, C("decomp") - 0.4, C("aboveall") - 0.2, 0.5));
      [C("decomp"), C("battery"), C("cyber"), C("deliberate")].forEach(function (a, i) {
        var o = S.easeOut(S.prog(t, a - 0.1, a + 0.5));
        S.show(items[i], o, "translateX(" + (24 * (1 - o)).toFixed(1) + "px)");
      });
      S.show(listFoot, S.easeOut(S.prog(t, C("deliberate") + 2.2, C("deliberate") + 2.8)));

      S.show(souls, S.fadeWin(t, C("how") - 0.3, C("pings") - 0.1, 0.5));
      S.show(soulsNum, S.easeOut(S.prog(t, C("souls") - 0.2, C("souls") + 0.9)), "scale(" + (0.96 + 0.04 * S.easeOut(S.prog(t, C("souls") - 0.2, C("souls") + 1.2))).toFixed(3) + ")");
      soulsNum.style.transformOrigin = "left top";
      S.show(soulsUnit, S.easeOut(S.prog(t, C("souls") + 0.4, C("souls") + 1.0)));
      S.show(soulsBeacon, S.easeOut(S.prog(t, C("beacon"), C("beacon") + 0.6)));

      // Seven rings, one per handshake.
      rings.forEach(function (p, i) {
        var a = C("pings") + i * 0.42;
        S.drawPath(p, S.ease(S.prog(t, a, a + 1.4)));
        p.style.opacity = (i === 6 ? 1 : 0.8) * (1 - 0.5 * S.prog(t, C("greatest"), C("greatest") + 1.5));
      });
      S.show(ringLab, S.fadeWin(t, C("pings") + 3.2, S.duration + 5, 0.6));
      S.show(pings, S.fadeWin(t, C("pings") + 0.4, C("greatest") - 0.2, 0.6));

      var eo = S.easeOut(S.prog(t, C("greatest") + 0.2, C("greatest") + 1.6));
      S.show(endcard, eo, "translateY(" + (26 * (1 - eo)).toFixed(1) + "px)");
    },
    sfx: function () {
      var out = [];
      for (var i = 0; i < 7; i++) out.push(["ping", C("pings") + i * 0.42]);
      out.push(["hit", C("souls")]);
      out.push(["hit", C("greatest") + 0.2]);
      return out;
    },
  });
})();
</script>
</body>
</html>
